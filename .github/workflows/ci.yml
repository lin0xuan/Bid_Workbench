name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bid_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bid_test -d bid_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BID_TEST_DATABASE_URL: postgresql+psycopg://bid_test:ci-only-password@127.0.0.1:5432/bid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements/base.lock -r requirements/dev.in
      - run: python -m pytest -q
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/*.lock
      - run: pip install -r requirements/base.lock -r requirements/dev.in
      - run: python -m pytest -q
      - run: ruff check backend tests scripts
      - run: for file in frontend/web/*.js frontend/desktop/*.js; do node --check "$file"; done
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: |
          curl --fail http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/api/ready
      - if: always()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down
